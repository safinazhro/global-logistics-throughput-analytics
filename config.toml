# Tema visual profesional untuk Global Logistics Throughput and Labor Analytics
# Palet warna terinspirasi industri maritim/logistik: navy, steel blue, slate gray.
# Dikonfigurasi lewat cara resmi Streamlit (bukan CSS/HTML kustom) agar aman
# dari risiko TypeError saat deploy ke Cloud.

[theme]
base = "light"
primaryColor = "#1B6B93"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#0A2540"
font = "sans serif"

[client]
showErrorDetails = true

[browser]
gatherUsageStats = false
